name: Build and Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # ── Build per-platform wheels ──────────────────────────────────────
  build-wheel-linux:
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: dnf install -y ninja-build cmake python3.12 python3.12-pip

      - name: Build native library
        run: |
          cmake -G Ninja -B build/desktop-release \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-O3 -DNDEBUG"
          cmake --build build/desktop-release --config Release

      - name: Copy and strip native lib
        run: |
          mkdir -p python/edgevdb/lib/linux
          find build/desktop-release -name "libedgevdb_shared.so" -exec cp {} python/edgevdb/lib/linux/ \;
          strip python/edgevdb/lib/linux/libedgevdb_shared.so

      - name: Build wheel
        working-directory: python
        run: |
          python3.12 -m pip install --upgrade build wheel setuptools
          rm -rf dist/
          python3.12 -m build --wheel
          ls -lh dist/

      - name: Re-tag wheel as manylinux_2_28_x86_64
        working-directory: python
        run: |
          python3.12 -m pip install wheel
          for whl in dist/*.whl; do
            python3.12 -m wheel tags --remove \
              --platform-tag manylinux_2_28_x86_64 \
              "$whl"
          done
          ls -lh dist/

      - name: Verify wheel contents
        working-directory: python
        run: |
          python3.12 -c "
          import zipfile, pathlib, sys
          for whl in pathlib.Path('dist').glob('*.whl'):
              z = zipfile.ZipFile(whl)
              native = [i for i in z.infolist() if i.filename.endswith('.so')]
              print(f'{whl.name} ({whl.stat().st_size / 1024 / 1024:.1f} MB)')
              for i in native:
                  print(f'  {i.file_size:>10,}  {i.filename}')
              if not native:
                  print('ERROR: No .so found in wheel!'); sys.exit(1)
          "

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux
          path: python/dist/*.whl

  build-wheel-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Build native library
        run: |
          cmake --preset desktop-release
          cmake --build build/desktop-release --config Release

      - name: Copy and strip native lib
        run: |
          mkdir -p python/edgevdb/lib/darwin
          find build/desktop-release -name "libedgevdb_shared.dylib" -exec cp {} python/edgevdb/lib/darwin/ \;
          strip -x python/edgevdb/lib/darwin/libedgevdb_shared.dylib

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        working-directory: python
        run: |
          pip install --upgrade build wheel setuptools
          rm -rf dist/
          python -m build --wheel
          ls -lh dist/

      - name: Re-tag wheel as macosx
        working-directory: python
        run: |
          pip install wheel
          for whl in dist/*.whl; do
            python -m wheel tags --remove \
              --platform-tag macosx_11_0_arm64 \
              "$whl"
          done
          ls -lh dist/

      - name: Verify wheel contents
        working-directory: python
        run: |
          python3 -c "
          import zipfile, pathlib, sys
          for whl in pathlib.Path('dist').glob('*.whl'):
              z = zipfile.ZipFile(whl)
              native = [i for i in z.infolist() if i.filename.endswith('.dylib')]
              print(f'{whl.name} ({whl.stat().st_size / 1024 / 1024:.1f} MB)')
              for i in native:
                  print(f'  {i.file_size:>10,}  {i.filename}')
              if not native:
                  print('ERROR: No .dylib found in wheel!'); sys.exit(1)
          "

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-macos
          path: python/dist/*.whl

  build-wheel-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Build native library
        run: |
          cmake --preset desktop-release
          cmake --build build/desktop-release --config Release

      - name: Copy native lib
        shell: bash
        run: |
          mkdir -p python/edgevdb/lib/windows
          find build/desktop-release -name "libedgevdb_shared.dll" -o -name "edgevdb_shared.dll" | head -1 | xargs -I{} cp {} python/edgevdb/lib/windows/libedgevdb_shared.dll

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        working-directory: python
        run: |
          pip install --upgrade build wheel setuptools
          Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
          python -m build --wheel
          Get-ChildItem dist/

      - name: Re-tag wheel as win_amd64
        working-directory: python
        shell: bash
        run: |
          pip install wheel
          for whl in dist/*.whl; do
            python -m wheel tags --remove \
              --platform-tag win_amd64 \
              "$whl"
          done
          ls -lh dist/

      - name: Verify wheel contents
        shell: bash
        run: |
          python -c "
          import zipfile, pathlib, sys
          for whl in pathlib.Path('python/dist').glob('*.whl'):
              z = zipfile.ZipFile(whl)
              native = [i for i in z.infolist() if i.filename.endswith('.dll')]
              print(f'{whl.name} ({whl.stat().st_size / 1024 / 1024:.1f} MB)')
              for i in native:
                  print(f'  {i.file_size:>10,}  {i.filename}')
              if not native:
                  print('ERROR: No .dll found in wheel!'); sys.exit(1)
          "

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-windows
          path: python/dist/*.whl

  # ── Build source distribution ──────────────────────────────────────
  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        working-directory: python
        run: |
          pip install --upgrade build
          python -m build --sdist
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: python/dist/*.tar.gz

  # ── Publish ────────────────────────────────────────────────────────
  publish-testpypi:
    needs: [build-wheel-linux, build-wheel-macos, build-wheel-windows, build-sdist]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: List all artifacts
        run: ls -lh dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    needs: [build-wheel-linux, build-wheel-macos, build-wheel-windows, build-sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: List all artifacts
        run: ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
