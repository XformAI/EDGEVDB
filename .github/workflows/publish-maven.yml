name: Publish Android SDK to GitHub Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.2.0)"
        required: true

permissions:
  packages: write
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install CMake and NDK
        run: |
          yes | sdkmanager --install "cmake;3.22.1" "ndk;27.0.12077973" || true

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            TAG="${GITHUB_REF#refs/tags/v}"
            echo "version=${TAG}" >> $GITHUB_OUTPUT
          fi

      - name: Delete existing package version (if any)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PACKAGE="edgevdb-android"
          echo "Checking for existing version $VERSION of $PACKAGE..."

          # List all versions and find the matching one
          VERSION_ID=$(gh api \
            "/orgs/XformAI/packages/maven/$PACKAGE/versions" \
            --jq ".[] | select(.name == \"$VERSION\") | .id" 2>/dev/null || echo "")

          if [ -n "$VERSION_ID" ]; then
            echo "Found existing version $VERSION (id=$VERSION_ID), deleting..."
            gh api --method DELETE \
              "/orgs/XformAI/packages/maven/$PACKAGE/versions/$VERSION_ID" \
              2>/dev/null && echo "Deleted successfully" || echo "Delete failed (may need manual cleanup)"
          else
            echo "No existing version $VERSION found, proceeding with publish"
          fi

      - name: Build and publish to GitHub Packages
        working-directory: android
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew :sdk:publishReleasePublicationToGitHubPackagesRepository \
            -PEDGEVDB_VERSION=${{ steps.version.outputs.version }}
