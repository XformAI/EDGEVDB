name: EdgeVDB CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake --preset desktop-debug

      - name: Build
        run: cmake --build --preset desktop-debug

      - name: Test
        run: ctest --test-dir build/desktop-debug --output-on-failure

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Build Android
        working-directory: android
        run: ./gradlew assembleRelease

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build iOS (arm64)
        run: |
          cmake --preset ios-arm64
          cmake --build build/ios-arm64

      - name: Build iOS Simulator (x86_64)
        run: |
          cmake --preset ios-simulator-x86_64
          cmake --build build/ios-simulator-x86_64

      - name: Build XCFramework
        working-directory: ios
        run: |
          chmod +x build-xcframework.sh
          ./build-xcframework.sh

      - name: Upload XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: EdgeVDB-xcframework
          path: ios/build/EdgeVDB.xcframework
