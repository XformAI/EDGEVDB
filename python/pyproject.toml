[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edgevdb"
version = "0.1.0"
description = "EdgeVDB — On-device vector database with HNSW, hybrid retrieval, knowledge graph, and CRDT sync"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.8"
authors = [
    {name = "XformAI", email = "contact@xformai.in"}
]
keywords = ["vector-database", "hnsw", "embedding", "rag", "on-device", "edge-ai", "semantic-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/XformAI/EDGEVDB"
Documentation = "https://xformai.github.io/EDGEVDB/"
Repository = "https://github.com/XformAI/EDGEVDB"
Issues = "https://github.com/XformAI/EDGEVDB/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["edgevdb*"]

[tool.setuptools.package-data]
"edgevdb" = [
    "lib/linux/*.so",
    "lib/linux/*.so.*",
    "lib/darwin/*.dylib",
    "lib/windows/*.dll",
    "lib/README.md",
]

# Disable VCS-based file discovery so .gitignore doesn't exclude native libs.
# Only files matching package-data patterns (above) are included.
[tool.setuptools]
include-package-data = false
