[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "edgevdb"
version = "1.0.0"
description = "EdgeVDB — On-device Vector Database SDK for RAG"
readme = "../../README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.8"
authors = [
    {name = "EdgeVDB Team"}
]
keywords = ["vector-database", "hnsw", "embedding", "rag", "onnx", "on-device"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/edgevdb/edgevdb"
Documentation = "https://github.com/edgevdb/edgevdb/tree/main/docs"
Repository = "https://github.com/edgevdb/edgevdb"

[tool.setuptools.packages.find]
where = ["."]
include = ["edgevdb*"]
